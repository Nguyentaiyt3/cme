<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1">

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

.select2-container{
    width:100% !important;
}

.select2-selection{
    min-height:48px !important;
    padding-top:6px;
}

.select2-selection__rendered{
    white-space:normal !important;
    line-height:20px !important;
}

.select2-results__option{
    white-space:normal !important;
    word-break:break-word;
}

.header{
    background:#1f73b7;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    padding:30px;
}

h2{
    margin-top:0;
}

.notice{
    background:#d9edf7;
    color:#31708f;
    padding:15px;
    border-radius:4px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

select,
input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:4px;
    margin-bottom:20px;
}

.search-btn{
    background:#5cb85c;
    color:white;
    border:none;
    padding:14px 25px;
    font-size:16px;
    border-radius:4px;
    cursor:pointer;
}

.search-btn:hover{
    opacity:.9;
}

.search-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.search-wrapper{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:5px;
}

.loading{
    display:none;
    width:28px;
    height:28px;
    border:4px solid #d9d9d9;
    border-top:4px solid #2196f3;
    border-radius:50%;
    box-sizing:border-box;
    flex-shrink:0;
    animation:spin .8s linear infinite;
}

    
@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.result{
    margin-top:25px;
}

.success{
    color:#2e7d32;
    font-weight:bold;
    font-size:18px;
}

.error{
    color:#d32f2f;
    font-weight:bold;
    font-size:18px;
}

.action-buttons{
    margin-top:20px;
}

.view-btn{
    background:#2196f3;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:4px;
    cursor:pointer;
    margin-right:10px;
    font-size:16px;
    line-height:normal;
}

.download-btn{
    background:#ff9966;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:4px;
    display:inline-block;
}

.footer{
    text-align:center;
    color:#888;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
CME ĐIỆN TỬ - BỆNH VIỆN THỐNG NHẤT - VIỆN ARiHA
</div>

<div class="container">

<div class="card">

<h2>Chứng nhận điện tử</h2>

<div class="notice">
Vui lòng nhập đúng thông tin theo đăng ký
</div>

<select id="course"></select>

<label>Họ và tên học viên</label>

<input
id="name"
placeholder="Họ và tên đăng ký">

<label>Năm sinh học viên</label>

<input
id="year"
placeholder="Ví dụ: 1980">

<div class="search-wrapper">

<button
id="searchBtn"
class="search-btn"
onclick="searchCert()">

TÌM KIẾM CHỨNG CHỈ

</button>

<div id="loading" class="loading"></div>

</div>

<div
 id="result"
 class="result">
</div>

</div>

<div class="footer">
CME điện tử
</div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyvEJ_8w4RrctxYcsqZJiSep3HwuAhgzNAxpIzmBuF9LUKar-1OkdP2LfYscprpOzB6/exec";

fetch(API + "?action=courses")
  .then(res=>res.json())
  .then(loadCourses)
  .catch(err=>{
    console.error(err);
    alert("Không tải được danh sách khóa học.");
  });

function loadCourses(courses){

  const select = document.getElementById('course');

  select.innerHTML =
    '<option value="">Chọn khóa CME</option>';

  courses.forEach(course => {

    const option = document.createElement('option');

    option.value = course;
    option.textContent = course;

    select.appendChild(option);

  });

  setTimeout(function(){

    $('#course').select2({
      placeholder: 'Chọn khóa CME',
      width: '100%'
    });

  },100);
}

function searchCert(){

  const course =
    document.getElementById('course').value;

  const name =
    document.getElementById('name').value;

  const year =
    document.getElementById('year').value;

  if(!course){

  alert(
    'Vui lòng chọn khóa CME'
  );

  return;
}

  if(!name || !year){

  alert(
    'Vui lòng nhập họ tên và năm sinh'
  );

  return;
}

  // XÓA KẾT QUẢ CŨ NGAY
  document.getElementById('result').innerHTML = '';

  // HIỆN LOADING
  document.getElementById('loading').style.display = 'block';

  // KHÓA NÚT
  document.getElementById('searchBtn').disabled = true;

  fetch(
    API +
    "?action=search" +
    "&course=" + encodeURIComponent(course) +
    "&name=" + encodeURIComponent(name) +
    "&year=" + encodeURIComponent(year)
)
.then(res=>res.json())
.then(function(res){

      document.getElementById('loading').style.display = 'none';
      document.getElementById('searchBtn').disabled = false;

      showResult(res);
})
.catch(function(err){

      document.getElementById('loading').style.display = 'none';
      document.getElementById('searchBtn').disabled = false;

      document.getElementById('result').innerHTML =
      '<div class="error">Có lỗi xảy ra</div>';

      console.error(err);
});
}

function showResult(res){

  const result =
    document.getElementById('result');

  if(!res.found){

    result.innerHTML = `
      <div class="error">
        ❌ KHÔNG TÌM THẤY CHỨNG CHỈ
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="success">
      ✅ ĐÃ TÌM THẤY CHỨNG CHỈ
    </div>

    <div class="action-buttons">

      <button
        class="view-btn"
        onclick="window.open('${res.viewLink}','_blank')">

        XEM CHỨNG CHỈ

      </button>

      <a
        class="download-btn"
        href="${res.downloadLink}">

        TẢI CHỨNG CHỈ

      </a>

    </div>
  `;
}

</script>

</body>
</html>
